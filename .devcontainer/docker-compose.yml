# Dev container: the app container shares the database's network, so PostgreSQL is on localhost:5432
# exactly as in docs and apps/api/.env.example. Local development only — never production.
services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-22-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    network_mode: service:db
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: fin
      POSTGRES_PASSWORD: fin
      POSTGRES_DB: financiers_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
