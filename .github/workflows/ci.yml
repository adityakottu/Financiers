name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fin
          POSTGRES_PASSWORD: fin
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fin" --health-interval 5s --health-timeout 5s --health-retries 10
      # S3-compatible server for the document-store test (production uses AWS S3 with SSE-KMS).
      s3:
        image: adobe/s3mock:latest
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: fin-docs
        ports: ['9090:9090']
    env:
      TEST_DATABASE_URL: postgresql://fin:fin@localhost:5432/financiers_test
      S3_TEST_ENDPOINT: http://localhost:9090
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter "./packages/**" run build
      - name: Unit tests (packages)
        run: pnpm --filter "./packages/**" run test
      - name: Typecheck
        run: pnpm -r run typecheck
      - name: Security lint (no SQL string building, no raw HTML, no eval, no console in the API)
        run: pnpm lint
      - name: API tests (unit + integration against PostgreSQL 16)
        run: pnpm --filter @fin/api run test
      - name: Build API
        run: pnpm --filter @fin/api run build
      - name: Build web
        run: pnpm --filter @fin/web run build

      - name: Dependency audit (high and critical)
        run: pnpm audit --audit-level high --prod
        continue-on-error: true

  # Production images: built exactly as deployed, then scanned. HIGH / CRITICAL fixable
  # vulnerabilities fail the build (doc 13 §4).
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          tags: financiers-${{ matrix.app }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Smoke test (runs as non-root, starts)
        run: |
          test "$(docker run --rm --entrypoint id financiers-${{ matrix.app }}:ci -u)" = 10001
          if [ "${{ matrix.app }}" = api ]; then
            docker run --rm --entrypoint sh -e DB_OWNER_USERNAME=u -e DB_OWNER_PASSWORD=p -e DB_HOST=h financiers-api:ci -c 'pg_dump --version && node dist/ops/db-url.js && test -x /app/scripts/backup.sh && test -s /etc/ssl/rds-global-bundle.pem'
          else
            docker run -d --name web -p 3000:3000 financiers-web:ci && sleep 5 && curl -sf -o /dev/null http://localhost:3000/login
          fi
      - name: Vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: financiers-${{ matrix.app }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: Compose file is valid
        working-directory: deploy/compose
        run: cp .env.example .env && docker compose config -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
