name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fin
          POSTGRES_PASSWORD: fin
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fin" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://fin:fin@localhost:5432/financiers_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter "./packages/**" run build
      - name: Unit tests (packages)
        run: pnpm --filter "./packages/**" run test
      - name: Typecheck
        run: pnpm -r run typecheck
      - name: Security lint (no SQL string building, no raw HTML, no eval, no console in the API)
        run: pnpm lint
      - name: API tests (unit + integration against PostgreSQL 16)
        run: pnpm --filter @fin/api run test
      - name: Build API
        run: pnpm --filter @fin/api run build
      - name: Build web
        run: pnpm --filter @fin/web run build

      - name: Dependency audit (high and critical)
        run: pnpm audit --audit-level high --prod
        continue-on-error: true

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
