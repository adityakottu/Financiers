# Local development services. Production uses managed RDS / S3 (docs/13-deployment-architecture.md).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fin
      POSTGRES_PASSWORD: fin
      POSTGRES_DB: financiers_dev
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fin']
      interval: 5s
      retries: 10

volumes:
  pgdata:
